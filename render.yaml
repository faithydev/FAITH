# FAITH public demo: the API (with its worker loop) and its Postgres, both on Render's free plan.
# Payments run through the labelled simulator and email is recorded, not sent (PUBLIC_DEMO).
# The database is Render's free Postgres, wired in automatically; nothing has to be pasted.
services:
  - type: web
    name: faith-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm run build:packages && pnpm --filter @faith/api build
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: PUBLIC_DEMO
        value: "true"
      - key: RUN_WORKER
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: API_PORT
        value: "10000"
      # Render creates the database below and hands its address to the API itself.
      - key: DATABASE_URL
        fromDatabase:
          name: faith-db
          property: connectionString
      # The web app on Vercel. The API's own address comes from Render (RENDER_EXTERNAL_URL).
      - key: WEB_ORIGIN
        value: https://faith-platform-green.vercel.app
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECRET
        generateValue: true
      - key: DOWNLOAD_SIGNING_SECRET
        generateValue: true
      - key: MOCK_PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock
      - key: ALLOW_MOCK_PAYMENTS
        value: "true"
      - key: EMAIL_DRIVER
        value: dev
      # Uploads live in Cloudflare R2 (bucket faith-files): the server's own disk is wiped on every deploy.
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: faith-files
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Optional social sign-in (GOOGLE_CLIENT_ID/SECRET, APPLE_CLIENT_ID/TEAM_ID/KEY_ID/PRIVATE_KEY):
      # add them later under the service's Environment tab; each button turns on once its values are set.

databases:
  - name: faith-db
    plan: free
    region: frankfurt
    databaseName: faith
    user: faith
