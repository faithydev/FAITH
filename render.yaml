# FAITH public demo: the API (with its worker loop) on Render's free plan, data in Neon.
# Payments run through the labelled simulator and email is recorded, not sent (PUBLIC_DEMO).
# In the Render dashboard you set one value yourself: DATABASE_URL (from Neon).
services:
  - type: web
    name: faith-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm run build:packages && pnpm --filter @faith/api build
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: PUBLIC_DEMO
        value: "true"
      - key: RUN_WORKER
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: API_PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      # The web app on Vercel. The API's own address comes from Render (RENDER_EXTERNAL_URL).
      - key: WEB_ORIGIN
        value: https://faith-platform-green.vercel.app
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECRET
        generateValue: true
      - key: DOWNLOAD_SIGNING_SECRET
        generateValue: true
      - key: MOCK_PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock
      - key: ALLOW_MOCK_PAYMENTS
        value: "true"
      - key: EMAIL_DRIVER
        value: dev
      - key: STORAGE_DRIVER
        value: local
      # Optional social sign-in (GOOGLE_CLIENT_ID/SECRET, APPLE_CLIENT_ID/TEAM_ID/KEY_ID/PRIVATE_KEY):
      # add them later under the service's Environment tab; each button turns on once its values are set.
