# FAITH public demo: the API (with its worker loop) on Render's free plan, data in Neon.
# Payments run through the labelled simulator and email is recorded, not sent (PUBLIC_DEMO).
# In the Render dashboard you set two values yourself: DATABASE_URL (from Neon) and WEB_ORIGIN
# (the Vercel address of the web app).
services:
  - type: web
    name: faith-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm run build:packages && pnpm --filter @faith/api build
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: PUBLIC_DEMO
        value: "true"
      - key: RUN_WORKER
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: API_PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: API_ORIGIN
        sync: false
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECRET
        generateValue: true
      - key: DOWNLOAD_SIGNING_SECRET
        generateValue: true
      - key: MOCK_PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock
      - key: ALLOW_MOCK_PAYMENTS
        value: "true"
      - key: EMAIL_DRIVER
        value: dev
      - key: STORAGE_DRIVER
        value: local
      # Optional social sign-in. Each button turns on only when its values are all set.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
